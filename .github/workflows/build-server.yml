name: Build LocalSS Server

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build-windows-server:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pyinstaller

      - name: Build Executable
        shell: pwsh
        run: |
          pyinstaller --onefile --name LocalSS_Server --collect-all pwdlib --collect-all argon2 server/main.py

      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: LocalSS-Windows-Server
          path: dist/LocalSS_Server.exe